name: Preview

# Publishes every PR build to pkg.pr.new so reviewers can install it:
#   pnpm add https://pkg.pr.new/<owner>/<repo>@<pr-number>
# Needs the pkg.pr.new GitHub App installed on the repo, or it fails on every PR.

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm dlx pkg-pr-new@0.0.88 publish
