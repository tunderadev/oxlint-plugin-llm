name: Preview

# Publishes every PR build to pkg.pr.new so reviewers can install it:
#   pnpm add https://pkg.pr.new/<owner>/<repo>@<pr-number>
# Needs the pkg.pr.new GitHub App installed on the repo, or it fails on every PR.
# A private package has nothing to preview, so the step skips itself there. That is
# how the template repo stays green without the app.
# --pnpm packs with pnpm: npm pack refuses to run because devEngines pins pnpm, and
# it cannot resolve catalog: versions either.

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish the PR build, unless the package is private
        run: |
          if [ "$(node -p "require('./package.json').private === true")" = true ]; then
            echo "package.json says private, so there is nothing to preview"
          else
            pnpm dlx pkg-pr-new@0.0.88 publish --pnpm
          fi
